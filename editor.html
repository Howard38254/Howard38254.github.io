<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Howard’s portfolio editor</title><style>body{margin:0;font:14px Arial,sans-serif;background:#eee}header{display:flex;gap:15px;align-items:center;flex-wrap:wrap;padding:15px;background:white}button{padding:10px 15px;border:0;background:#111;color:white;border-radius:8px;font:inherit;cursor:pointer}label{display:flex;gap:8px;align-items:center}iframe{width:100%;height:calc(100vh - 120px);border:0}p{margin:0;padding:0 15px 15px;background:white;font-size:12px}input{min-height:30px}</style></head><body><header><strong>Portfolio editor</strong><label><input type="checkbox" id="edit">Edit text</label><label>Yellow <input type="color" value="#ffdf00" id="yellow"></label><label>Accent <input type="color" value="#33d487" id="green"></label><button id="save">Download edited homepage</button><a href="docs/HOW-TO-EDIT.md">Editing guide</a></header><p id="status">Preview changes here. Download to save; ask Codex to publish your downloaded homepage.</p><iframe id="preview" src="index.html" title="Editable portfolio preview"></iframe><script>
const frame=document.getElementById('preview'),toggle=document.getElementById('edit'),status=document.getElementById('status');let doc;
frame.addEventListener('load',()=>{doc=frame.contentDocument;toggle.checked=false;doc.addEventListener('click',event=>{if(toggle.checked&&event.target.closest('[contenteditable="true"]')){event.preventDefault();event.stopImmediatePropagation();}},true);});
toggle.addEventListener('change',()=>{if(!doc)return;doc.querySelectorAll('[data-edit]').forEach(element=>{element.contentEditable=String(toggle.checked);element.style.outline=toggle.checked?'2px dashed #168a61':'';});status.textContent=toggle.checked?'Click outlined text to edit. Turn off editing to use project controls.':'Preview mode. Download your changes to save.';});
for(const name of ['yellow','green'])document.getElementById(name).addEventListener('input',event=>{if(doc)doc.documentElement.style.setProperty('--'+name,event.target.value);});
document.getElementById('save').addEventListener('click',()=>{if(!doc)return;const clone=doc.documentElement.cloneNode(true);clone.classList.remove('js');clone.querySelectorAll('[contenteditable]').forEach(element=>{element.removeAttribute('contenteditable');element.style.removeProperty('outline');});clone.querySelectorAll('dialog').forEach(dialog=>dialog.removeAttribute('open'));const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='index.html';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='Downloaded index.html. Give this file to Codex or upload it to your GitHub repository to publish.';});
</script></body></html>
